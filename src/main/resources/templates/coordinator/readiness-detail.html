<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::section})}">
<head>
    <title>Readiness</title>
</head>
<body>
<section>

    <div th:replace="~{layout/_pagehero :: hero(
            'तैयारी पंजी',
            'Readiness ledger',
            'One dissertation against every requirement, with the evidence behind each line.',
            'COORDINATOR')}"></div>

    <div class="page-head">
        <div>
            <h2 th:text="${ledger.studentName}">Avika Singh</h2>
            <p class="lead" style="margin:0">
                <span th:text="${ledger.rollNo}">24MCS001</span>
                <span th:if="${ledger.thesisCode != null}"> · <code th:text="${ledger.thesisCode}">MT26-001</code></span>
                <span th:if="${ledger.topicTitle != null}"> · <span th:text="${ledger.topicTitle}">Topic</span></span>
                · guide <span th:text="${ledger.supervisorName}">Dr A Sharma</span>
            </p>
        </div>
        <div class="btn-row no-print">
            <a th:href="@{/coordinator/readiness}" class="btn btn-ghost btn-sm">All students</a>
            <a th:if="${ledger.recommendationFiled()}"
               th:href="@{/coordinator/recommendation/{id}(id=${ledger.allocationId})}" class="btn btn-ghost btn-sm">Summary sheet</a>
            <a th:href="@{/provenance/{id}(id=${ledger.allocationId})}" class="btn btn-ghost btn-sm">Provenance</a>
            <button type="button" class="btn btn-ghost btn-sm" data-print>Print</button>
        </div>
    </div>

    <div th:replace="~{layout/_ledger :: ledger(${ledger})}"></div>

</section>
</body>
</html>
