<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="flash">
    <div class="alert alert-success" th:if="${success}" role="status">
        <span th:text="${success}">Saved.</span>
    </div>
    <div class="alert alert-error" th:if="${error}" role="alert">
        <span th:text="${error}">Something went wrong.</span>
    </div>
    <div class="alert alert-info" th:if="${info}" role="status">
        <span th:text="${info}">Note.</span>
    </div>
</div>

</body>
</html>
