<!DOCTYPE html>
<!--
  Navbar fragment. Role-aware via sec:authorize.

  sec:authorize takes a Spring Security expression, so a user holding two roles
  (a faculty member who is both SUPERVISOR and REVIEWER) sees both link groups.
  That is why User.roles is a Set, not a single column.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav class="navbar" th:fragment="navbar">
    <div class="container navbar-inner">

        <a class="brand" th:href="@{/}">
            <span class="brand-mark">DMS</span>
            <span class="brand-text">Dissertation Management</span>
        </a>

        <ul class="nav-links">

            <li sec:authorize="hasRole('STUDENT')">
                <a th:href="@{/student/dashboard}">Dashboard</a>
            </li>
            <li sec:authorize="hasRole('STUDENT')">
                <a th:href="@{/student/topic}">My topic</a>
            </li>

            <li sec:authorize="hasRole('SUPERVISOR')">
                <a th:href="@{/supervisor/dashboard}">Dashboard</a>
            </li>
            <li sec:authorize="hasRole('SUPERVISOR')">
                <a th:href="@{/supervisor/topics}">Topic approvals</a>
            </li>

            <li sec:authorize="hasRole('COORDINATOR')">
                <a th:href="@{/coordinator/dashboard}">Dashboard</a>
            </li>
            <li sec:authorize="hasRole('COORDINATOR')">
                <a th:href="@{/coordinator/allocate}">Allocate guides</a>
            </li>

            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/users}">Users</a>
            </li>

            <li sec:authorize="isAuthenticated()">
                <span class="nav-user" sec:authentication="name">user</span>
            </li>
            <li sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit" class="btn btn-ghost btn-sm">Sign out</button>
                </form>
            </li>

            <li sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-primary btn-sm">Sign in</a>
            </li>

        </ul>

    </div>
</nav>

</body>
</html>
