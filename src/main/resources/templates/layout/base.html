<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:replace="${title}">Dissertation Management System</title>

    <!-- Mulish is the institute typeface. preconnect first so the font request
         starts before the stylesheet has finished parsing. For an air-gapped
         deployment, self-host these two files and drop the CDN links. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700;800;900&display=swap">

    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/images/favicon.png}">

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<!-- The red rail down the left edge, as on the institute site. -->
<div class="niet-rail">
    <button type="button" class="rail-menu" data-rail-menu aria-label="Menu">
        <span></span><span></span><span></span>
    </button>
</div>

<div class="page-shell">

    <div class="scroll-rule" aria-hidden="true"></div>

    <div class="container">
        <div class="ambient">
            <span>Noida Institute of Engineering and Technology &middot; An Autonomous Institute</span>
            <span class="ambient-clock" data-clock aria-hidden="true"></span>
        </div>
    </div>

    <div th:replace="~{layout/_navbar :: navbar}"></div>

    <main class="container">
        <div th:replace="~{layout/_flash :: flash}"></div>

        <!-- Shown until the address is confirmed. Notifications are in-app, so an
             address nobody checked is a silent failure until it matters. -->
        <div th:if="${emailUnconfirmed}" class="alert alert-error no-print">
            <strong>Your email address is not confirmed.</strong>
            Decisions on your topic and submissions are recorded here, but we cannot
            reach you outside the system until you confirm it.
            <form th:action="@{/account/resend-verification}" method="post" class="inline-form"
                  style="margin-left:8px">
                <button type="submit" class="btn btn-ghost btn-sm">Send me the link</button>
            </form>
        </div>
        <div th:replace="${content}"></div>
    </main>

    <div th:replace="~{layout/_footer :: footer}"></div>
</div>

<!-- Text-size controls, as the institute site offers. -->
<div class="a11y no-print">
    <button type="button" data-text-scale="up" aria-label="Increase text size">A+</button>
    <button type="button" data-text-scale="reset" aria-label="Reset text size">A</button>
    <button type="button" data-text-scale="down" aria-label="Decrease text size">A&minus;</button>
</div>

</body>
</html>
