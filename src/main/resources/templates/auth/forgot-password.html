<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::section})}">
<head>
    <title>Forgotten password</title>
</head>
<body>
<section>

    <div th:replace="~{layout/_pagehero :: hero(
            'पासवर्ड पुनर्प्राप्ति',
            'Forgotten password',
            'We will email you a link to set a new one.',
            'ALL')}"></div>

    <div class="auth-card">
        <form th:action="@{/forgot-password}" method="post" th:object="${form}">

            <div class="field">
                <label for="email">Institute email address</label>
                <input type="email" id="email" th:field="*{email}" autocomplete="email"
                       placeholder="you@niet.co.in" required autofocus>
                <span class="field-error" th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}">Enter your address</span>
            </div>

            <div class="btn-row" style="justify-content:flex-start">
                <button type="submit" class="btn btn-primary">Send the link</button>
                <a th:href="@{/login}" class="btn btn-ghost">Back to sign in</a>
            </div>
        </form>

        <p th:unless="${mailIsReal}" class="status-note">
            No mail server is configured on this instance, so the link will be written to
            the application log rather than sent.
        </p>
    </div>

</section>
</body>
</html>
