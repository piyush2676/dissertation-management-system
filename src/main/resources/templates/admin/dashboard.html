<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: page(~{::title}, ~{::section})}">
<head>
    <title>Admin dashboard</title>
</head>
<body>
<section>

    <div th:replace="~{layout/_pagehero :: hero(
            'प्रशासन पटल',
            'Admin dashboard',
            'Accounts, roles and the audit trail behind every state change.',
            'ADMIN')}"></div>

    <div class="card-grid reveal">
        <article class="card">
            <h3>Users &amp; roles</h3>
            <p>Create accounts, assign roles, enable and disable users.</p>
            <p class="phase-tag">Phase 1</p>
        </article>
        <article class="card">
            <h3>Audit log</h3>
            <p>Every state change, with actor and timestamp.</p>
            <p class="phase-tag">Phase 8</p>
        </article>
    </div>

</section>
</body>
</html>
