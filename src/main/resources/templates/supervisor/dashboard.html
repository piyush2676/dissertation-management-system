<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: page(~{::title}, ~{::section})}">
<head>
    <title>Supervisor dashboard</title>
</head>
<body>
<section>

    <div th:replace="~{layout/_pagehero :: hero(
            'मार्गदर्शक पटल',
            'Supervisor dashboard',
            'Your students, their topics, and everything waiting on your decision.',
            'SUPERVISOR')}"></div>

    <div class="card-grid reveal">
        <article class="card">
            <h3>Topic approvals</h3>
            <p>Proposals waiting on your decision.</p>
            <p class="phase-tag">Phase 2</p>
        </article>
        <article class="card">
            <h3>My students</h3>
            <p>Students allocated to you, and your remaining capacity.</p>
            <p class="phase-tag">Phase 3</p>
        </article>
        <article class="card">
            <h3>Submissions to review</h3>
            <p>Latest version of each milestone submission.</p>
            <p class="phase-tag">Phase 5</p>
        </article>
        <article class="card">
            <h3>Evaluation</h3>
            <p>Score against the rubric and record viva remarks.</p>
            <p class="phase-tag">Phase 6</p>
        </article>
    </div>

</section>
</body>
</html>
