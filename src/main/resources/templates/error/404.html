<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::section})}">
<head>
    <title>Page not found</title>
</head>
<body>
<section>
    <div class="hero">
        <span class="badge badge-draft">404</span>
        <h1>Page not found</h1>
        <p class="lead">That page does not exist, or it has moved.</p>
        <a th:href="@{/}" class="btn btn-primary">Go home</a>
    </div>
</section>
</body>
</html>
