<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::section})}">
<head>
    <title>Access denied</title>
</head>
<body>
<section>
    <div class="hero-wash">
        <span class="eyebrow">This record is not yours</span>

        <h1 class="display">
            <span class="error-code">403</span>
            <span class="display-hi" lang="hi">प्रवेश निषेध</span>
            <span class="display-sub" lang="en">Access denied</span>
        </h1>

        <p class="lead">
            You are signed in, but this record does not belong to you. If you believe it
            should, contact the project coordinator.
        </p>

        <div class="btn-row">
            <a th:href="@{/dashboard}" class="btn btn-primary btn-lg">Back to dashboard</a>
        </div>
    </div>
</section>
</body>
</html>
