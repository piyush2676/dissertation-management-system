<!DOCTYPE html>
<!--
  500 — deliberately shows no stack trace or exception message to the user.
  Details belong in the server log, not the browser.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::section})}">
<head>
    <title>Something went wrong</title>
</head>
<body>
<section>
    <div class="hero">
        <span class="badge badge-rejected">500</span>
        <h1>Something went wrong</h1>
        <p class="lead">
            The request could not be completed. The error has been logged — nothing you
            submitted was saved.
        </p>
        <a th:href="@{/}" class="btn btn-primary">Go home</a>
    </div>
</section>
</body>
</html>
