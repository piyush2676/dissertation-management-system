<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: page(~{::title}, ~{::section})}">
<head>
    <title>Something went wrong</title>
</head>
<body>
<section>
    <div class="hero-wash">
        <span class="eyebrow">The office could not complete this</span>

        <h1 class="display">
            <span class="error-code">500</span>
            <span class="display-hi" lang="hi">त्रुटि</span>
            <span class="display-sub" lang="en">Something went wrong</span>
        </h1>

        <p class="lead">
            The request could not be completed. The error has been logged — nothing you
            submitted was saved.
        </p>

        <div class="btn-row">
            <a th:href="@{/}" class="btn btn-primary btn-lg">Go home</a>
        </div>
    </div>
</section>
</body>
</html>
