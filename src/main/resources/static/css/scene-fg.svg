<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMax slice" role="presentation">
  <title>Institute frontage, near plane</title>

  <!--
    Near depth plane: the tree, the cart, the bicycles and the figures.
    Transparent everywhere else, so it can be translated over scene-bg.svg at a
    faster rate and read as closer to the viewer.

    Nothing here overlaps the far plane's geometry, which is what keeps the two
    files from ghosting when they separate.
  -->

  <defs>
    <clipPath id="canopy-clip"><rect x="1120" y="0" width="480" height="520"/></clipPath>
  </defs>

  <g clip-path="url(#canopy-clip)">
