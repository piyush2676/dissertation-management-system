  </g>
  <path d="M1362 300 L1386 300 L1400 600 L1352 600 Z" fill="#5d4529"/>
  <path d="M1372 372 L1424 330 L1430 344 L1378 392 Z" fill="#5d4529"/>

  <g fill="#1c1712" opacity=".12">
