    Far depth plane: sky, distant roofline, the facade, the awning, the notice
    board and the ground. Everything that should barely move when the viewer
    does. The near plane lives in scene-fg.svg.

    Split into two files rather than one, because parallax needs two planes to
    move at different rates. Drawing the foreground in both would ghost.
