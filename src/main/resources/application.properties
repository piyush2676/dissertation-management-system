spring.application.name=dissertation-management-system

# ---------------------------------------------------------------------------
# Local secrets  --  application-local.properties sits at the project root, is
# gitignored, and holds the database password. Kept out of this file so no
# credential ever enters git history.
# "optional:" means the app still starts if that file is absent (CI, a fresh
# clone) -- it fails at the datasource with a clear message instead.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:./application-local.properties

# ---------------------------------------------------------------------------
# Datasource  --  PostgreSQL 18, service postgresql-x64-18
# Setup:
#   1. CREATE DATABASE dms;
#   2. create application-local.properties at the project root containing:
#        spring.datasource.password=yourpassword
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/dms
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA  --  Flyway owns the schema. Hibernate only validates it.
# Never set ddl-auto=update: it silently diverges from the migrations.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Flyway  --  additive migrations only. Never edit an applied migration.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# File uploads  --  thesis PDFs (Phase 4)
# ---------------------------------------------------------------------------
dms.storage.location=./uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---------------------------------------------------------------------------
# Templates  --  no caching in dev, so template edits show on refresh
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.dms=DEBUG
logging.level.org.springframework.security=INFO
