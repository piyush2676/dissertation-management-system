spring.application.name=dissertation-management-system
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/dms
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Upload root. Never served as a static resource -- every read goes through
# SubmissionDownloadController so ownership is re-checked.
dms.storage.root=uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.thymeleaf.cache=false
logging.level.com.dms=DEBUG
logging.level.org.springframework.security=INFO

# Used to build the links in confirmation and reset emails. Set this to the real
# host before deploying, or every emailed link points at localhost.
dms.base-url=http://localhost:8080

# Mail is off until spring.mail.host is set: without it the links are written to
# the log instead of sent, so a checkout with no credentials still works.
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=...
# spring.mail.password=...
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# dms.mail.from=dissertation@niet.co.in

# Phase 7 -- Google AI Studio (Gemini), free tier.
#
# Off by default. The Google auto-configuration builds its client eagerly and
# throws at startup when no key is present, so the switches below are what keep
# a key-less checkout booting rather than any guard in application code.
# Turn the features on in application-local.properties (gitignored) -- see
# application-local.properties.example for the three lines.
spring.ai.model.chat=none
spring.ai.model.embedding.text=none
# The embedding and image *connection* auto-configurations are not gated by the
# switches above and demand a Vertex project-id, so they are excluded outright.
spring.autoconfigure.exclude=org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageConnectionAutoConfiguration

# Model choice and connection. Harmless while the switches above are none.
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}
# gemini-2.5-flash and text-embedding-004 are closed to keys created after mid-2026
# (404 "no longer available to new users"), so both moved. 768 dimensions keeps
# the vectors the size text-embedding-004 produced and the size a pgvector column
# would be declared at; gemini-embedding-001 defaults to 3072.
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

# Spring AI's default is 10 attempts with a x5 backoff, stacked on the Google client's
# own retries, so a busy model held the overlap page open for many minutes. Fail
# within a minute or so instead; the page says the check is unavailable and the
# student can run it again.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10s
