spring.application.name=dissertation-management-system
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/dms
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Upload root. Never served as a static resource -- every read goes through
# SubmissionDownloadController so ownership is re-checked.
dms.storage.root=uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.thymeleaf.cache=false
logging.level.com.dms=DEBUG
logging.level.org.springframework.security=INFO
