# The database lives outside Render (Neon, free Postgres that does not expire).
# Fill the DB_* values in the Render dashboard; they are deliberately not in git.
services:
  - type: web
    name: dissertation-management-system
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
